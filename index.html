<style>

  --good-soft: #def3e6;
  --bad: #b53a2e;
  --bad-soft: #f8e1de;
  --warn: #9a6408;
  --warn-soft: #f8ecd2;
  --card-rule: #c9dcef;
  --card-margin: #e0a0a0;
  --code-bg: #f5f7f9;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;

  --radius: 10px;
  color-scheme: light;
}

    --good: #5fd08c; --good-soft: #163324; --bad: #f08a7e; --bad-soft: #3a1c19; --warn: #e8b55a; --warn-soft: #362a12;
    --card-rule: #26384a; --card-margin: #6e3a3a; --code-bg: #12181d; --focus: #93a5ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #171e24; --sunk: #1e262e; --ink: #e5eaef; --muted: #9ba7b4; --line: #2b353f;
  --db: #45c4a7; --db-soft: #15312b; --py: #93a5ff; --py-soft: #1f2645;
  --good: #5fd08c; --good-soft: #163324; --bad: #f08a7e; --bad-soft: #3a1c19; --warn: #e8b55a; --warn-soft: #362a12;
  --card-rule: #26384a; --card-margin: #6e3a3a; --code-bg: #12181d; --focus: #93a5ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 650; }
h3 { font-size: 1.1rem; font-weight: 650; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.88em; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Header and nav */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; margin-right: auto; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: -0.01em; }
.brand span { font-size: 0.8rem; color: var(--muted); }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 700; font-size: 0.92rem;
}
.nav button:hover { color: var(--ink); background: var(--sunk); }
.nav button[aria-current="page"] { color: var(--surface); background: var(--ink); }
.nav .count { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 0.72rem; line-height: 1.5; text-align: center; }

main { padding-block: 24px 64px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel h2 { margin-bottom: 4px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface);
  padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.95rem; text-decoration: none;
}
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--sunk); filter: none; }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.good { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }

/* Module colour coding */
.mod-db { --mod: var(--db); --mod-soft: var(--db-soft); }
.mod-py { --mod: var(--py); --mod-soft: var(--py-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--mod-soft, var(--sunk)); color: var(--mod, var(--ink)); white-space: nowrap; }
.wk { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--mod); }

.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.hello p { max-width: 60ch; }
.dates { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.date { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; }

.date .days small { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.date .what { font-weight: 700; }
.date.past { opacity: 0.55; }
.stat { display: flex; flex-direction: column; gap: 2px; }

.md table, .ex table { border-collapse: collapse; font-size: 0.92rem; min-width: 60%; }

.card-face {

  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--card-margin) 38px, var(--card-margin) 40px, transparent 40px),

  background-position: 0 0, 0 30px;

  font-size: 1.1rem; white-space: pre-wrap; overflow-wrap: anywhere;

.pill.ok { background: var(--good-soft); color: var(--good); }

  .topic-row { grid-template-columns: 2.2rem 1fr; }
  .topic-row .meterbox { grid-column: 2; }
  .meter-label { text-align: left; }
}

  summary: 'Data vs information, why the file-based approach fails, what a DBMS gives you, and the three-level ANSI-SPARC architecture.',
  notes: `
## Data, information, knowledge, wisdom
- **Data** is a disorganised collection of facts, numbers, images, audio clips and so on.
- **Information** is related, organised data.
- **Knowledge** is extracted from related data.
- **Wisdom** is making decisions about future actions, based on knowledge, which is based on data.

## What is a database?
A **database** is a *shared collection of logically related data*, stored in an organised structure, which lets you interact with the data and extract useful information and knowledge.

"Logically related" means the data makes sense together because it describes one coherent system, entity or activity.

## How we got here
- **Manual filing systems**: documents in locked cabinets, perhaps across sites. Fine for small volumes or pure store-and-retrieve, but data is decentralised, duplicated and hard to summarise (e.g. the total salary bill across all departments).
- **File-based approach**: the first computerisation. Each application (e.g. payroll) worked on its own data files. Later, files were shared to reduce duplication.

## Problems with the file-based approach
- No data centralisation, so data is isolated and separated.
- Poor file design leads to **data duplication (redundancy)**.
- Updating many copies is inefficient and risks losing **data integrity**.
- **Data dependence**: dependent data should be updated together.
- Programs need to know the file storage structures (queries are not independent of the files).
- Incompatible file formats.
- Security only at file level, not data-item level.
- Limited structure, so only limited queries are possible.

## Key terms
- **Data integrity** = **consistency** (is duplicate data identical?) + **correctness** (is stored data accurate?). Maintained by a correct data model, validation on entry, protection from corruption or unauthorised access, and backup / recovery / transaction integrity.
- **Data dependency**: knowing the value of one piece of data is enough to tell you the value of another in the same table. Example: «Dept#» gives «DName» gives «Manager». The reverse is not necessarily true.

## The database approach and the DBMS
A database is **data-centred**, designed for the needs of the whole organisation, and shared among applications.

A **DBMS** (database management system) is software that manages a database: it allows **creation, manipulation (queries) and maintenance** of data and provides **controlled access** (security, integrity, recovery).

| DBMS | Notes |
|---|---|
| Microsoft Access | Single user, limited database size |
| Microsoft SQL Server | Multi-user, larger databases (used in the labs) |
| MySQL | Free, common as the database server for web apps |
| Oracle | Large-scale, multi-user, expensive, many facilities |

## Four main advantages of a database
1. **Data independence**: application programs are insulated from the data.
2. **Centralised data**: security and integrity can be maintained.
3. **Access flexibility**: a query language plus storage mechanisms.
4. **Data model**: reflects the real world (hierarchical, network, relational, object-oriented).

Other advantages: enforcement of standards, data sharing, economy of scale, increased productivity.

Disadvantages: **complexity**, **cost** (DBMS, conversion, maintenance), **higher impact of failure** (the downside of centralisation).

## DBMS facilities and functions
- Facilities: application programming language, report generator, **data dictionary** (stores data definitions), query language (SQL), screen/form editor.
- Functions: storage, retrieval and update; system catalogue; **transaction support** (concurrency control and recovery); user authorisation; network access; integrity; utilities (indexing, monitoring, import/export).

## ANSI-SPARC three-level architecture
| Level | Also called | What it holds |
|---|---|---|
| External | Views | What users and programs see: queries, reports |
| Conceptual | Database schema | One logical representation of all the data, e.g. linked tables |
| Internal | Physical | How data is stored and the access paths to it |

Each level is defined by a **schema**. The database schema is the blueprint of how the database is built.
- **Logical independence**: changes at one level (e.g. to applications or the logical design) do not necessarily force changes to the stored tables, and vice versa.
- **Physical independence**: changes to record storage do not necessarily require changes to the applications.

## Transactions
A **transaction** is one or more atomic, sequential operations that make up a single task. Operations fall into **CRUD**: Create, Read, Update, Delete.

ATM withdrawal: **Read** the balance, **Update** it (balance minus £20), **Create** a log record.

## Data models and NoSQL
Data models: hierarchical, network, **relational** (this module), object-oriented.

**NoSQL** ("Not only SQL"): document stores, key-value stores, graph databases (MongoDB, CouchDB, Neo4j). Useful when you need a flexible schema, huge volumes of unstructured data (big data), or when scaling matters more than consistency.

## Module facts worth knowing
- Assessment is **100% coursework**: Set Exercise **40%** (90 minutes, in your week 8 lab, w/c 9 November 2026) and Assignment **60%** (design document of 3 pages plus a 10 minute screencast, due **Friday 11 December 2026, 12 noon**).
- You pass with **40% aggregated** across both pieces. No written exam.
- Expect 200 hours of effort, of which about 140 to 152 are independent study (10 to 12 hours a week).

  notes: `
## The relational model
Proposed by **E. F. Codd (1970)** and based on mathematical **set theory**. It shows data as two-dimensional tables (relations) and defines relational algebra operations on them. SQL (standardised by ANSI in 1986) is how we manipulate relational data.

## Terminology
| Relational | Common | File-based |
|---|---|---|
| Relation | Table | File |
| Attribute | Column | Field |
| Tuple | Row | Record |
| Domain | (data type) | Data type |

- **Relation**: a named table with attributes (columns) and tuples (rows).
- **Attribute**: a named column, defined on a domain.
- **Tuple**: a row; one value per attribute.
- **Domain**: the set of all allowable values for an attribute (not just those present now). In practice we use **data types** plus **integrity constraints** (e.g. age is «tinyint» and must be 0 to 99). To join two tables, the linking attributes must share a domain / data type.

## Properties of a relation
- Each relation has a distinct name; each attribute has a distinct name.
- Each cell holds a **single (atomic) value**.
- All values of an attribute come from the same domain.
- **No duplicate tuples**.
- The order of attributes and of tuples has **no significance**.

## Relation schema
The relation name followed by its attributes in brackets, e.g. «PATIENT (patient_no, pat_name, condition, doctor)». Primary keys are underlined; in this module foreign keys are marked with an asterisk, e.g. «EMP (emp_no, ename, dept_no*)».

## Keys
- **Super key**: any combination of attributes that uniquely identifies each row.
- **Candidate key (CK)**: a super key that is **minimal**: (1) unique identification and (2) no attribute can be removed without losing uniqueness.
- **Primary key (PK)**: the candidate key chosen as the table's identifier.
- **Alternate key**: any candidate key not chosen as the PK (e.g. «nat_ins_no» when «emp_no» is the PK).
- **Composite key**: a key made of two or more attributes.
- **Foreign key (FK)**: an attribute in one table that matches the PK of another table; it expresses a relationship.

Because no two tuples are identical, a key always exists (even if it has to be all the attributes together).

## Choosing a primary key
Ask which attribute has unique values, and if none does, which combination does. This needs real-world knowledge of the domains.
- «EMPLOYEE (emp_no, ename, salary)»: names and salaries can repeat, so the PK is «emp_no».
- «TAKES (student_no, module_code, exam_result)»: a student takes many modules and a module has many students, so the PK is the composite «(student_no, module_code)».
- Sometimes an artificial key (like a student B-code) replaces a long composite key.

## Integrity rules
1. **Entity integrity**: no attribute of a primary key may be **NULL**.
2. **Referential integrity**: every FK value must either **match a PK value** in the referenced table or be **wholly NULL**.

**NULL** means unknown or not applicable. It is not zero and not spaces; it is the absence of a value.

Example: in «EMP (emp_no, ename, dept_no*)» and «DEPT (dept_no, dname)» you cannot give an employee department C unless C exists in DEPT. A NULL dept_no means "not yet assigned".

## What happens on delete?
If you delete a DEPT row that EMP rows still reference, SQL Server by default raises an error. The FK constraint can specify:
| Option | Effect |
|---|---|
| NO ACTION | Default. Error raised, nothing deleted |
| CASCADE | Matching rows in the referencing table are deleted too |
| SET NULL | The FK values are set to NULL |
| SET DEFAULT | The FK values are set to their default |
`,

  id: 'db3', week: 2, title: 'Entity-relationship modelling',
  summary: 'Entities, attributes and relationships. Cardinality, participation and multiplicity. Weak entities, fan traps and chasm traps.',
  notes: `
## Where ER modelling fits
| Stage | Task | Result |
|---|---|---|
| Data investigation | Find out the nature and use of the data | Outline data dictionary |
| Data modelling | Shape real-world facts into concepts | Conceptual model (ER diagram) |
| Conceptual design | Map to a specific data model | Relational schema |
| Implementation | Build the physical database | Internal schema and database |
| Security, monitoring, tuning | Secure, monitor and reorganise | Optimised, secure database |

The design process: **(1)** draw an ER diagram, **(2)** map it to a relational schema, **(3)** check each table is in **3NF** (normalisation). ER modelling is **top-down**; normalisation is **bottom-up**.

Keep the model relevant and limited to the application: a hospital billing database does not need allergies.

## Entities
An **entity type** is a group of objects with the same properties that the enterprise sees as important, uniquely identifiable, and described by more than one attribute. An **entity occurrence** is one instance.

Entities are usually **nouns**: people (staff, patients), objects (vehicles), organisations (suppliers), classes of thing (films, species) and events (exams, sales). Not every noun is an entity: skip it if there is only one instance, a fixed set (days of the week), or nobody cares about the instances.

By convention entity names are **singular** and in capitals: «MODULE», not «MODULES».

## Attributes
- **Simple**: one component (name, cost).
- **Composite**: several components (date = day/month/year).
- **Multi-valued**: several values (phone numbers).
- **Derived**: calculable from others (total cost = quantity × unit cost).
- The **identifier** (one attribute or a combination) becomes the primary key.
- Relationships can have attributes too, e.g. the «result» of a competitor in an event.

Do not put two or more attributes describing *another* entity in a table (team manager's name is fine in COUNTRY; adding the manager's mobile too suggests a TEAM_MANAGER entity).

## Relationships
A **relationship** is a meaningful association between entities, usually a **verb** ("DEPARTMENT Employs EMPLOYEE"). In Chen notation entities are **rectangles** and relationships are **diamonds**.

- **Degree**: number of entity types taking part (unary/recursive, binary, ternary).
- **Cardinality ratio**: 1:1, 1:N, N:1 or M:N. Always check **both directions**.
- **Participation**: **full** (mandatory, every instance takes part, shown by a **double line**) or **partial** (optional, **single line**). Assume full unless the scenario says otherwise.

### Reading cardinality
- 1:1: every lecturer teaches at most one module AND every module is taught by at most one lecturer.
- 1:N: a lecturer may teach many modules, but each module has one lecturer.
- M:N: lecturers teach many modules AND modules have many lecturers.

### Time changes cardinality
If DEPARTMENT Employs EMPLOYEE records only the **current** situation it is 1:N. If it records **history** (all past departments), it becomes M:N.

## Multiplicity (min, max)
Cardinality and participation together are called **multiplicity**:
| Notation | Meaning |
|---|---|
| (0,1) | zero or one |
| (1,1) | exactly one |
| (0,*) | zero or many |
| (1,*) | one or many |
| (3,8) | at least 3, at most 8 |

A minimum of 0 means partial participation; a minimum of 1 means full.

## Strong and weak entities
A **weak entity** is existence-dependent on another entity (NEXT_OF_KIN only exists if the PATIENT does). A **strong entity** is not. Most entities are strong.

## Connection traps
- **Fan trap**: two 1:N relationships fan out from a central entity, so the path between two related entities is ambiguous. DIVISION has DEPARTMENTs and DIVISION has EMPLOYEEs: which department is employee B in? Fix it by restructuring so the direct link exists (DIVISION has DEPARTMENT, DEPARTMENT employs EMPLOYEE).
- **Chasm trap**: the indirect path includes **partial participation**, so some related occurrences have no connection at all. BRANCH has STAFF who oversee ACCOUNTs, but an account with no staff member cannot be traced to a branch. Fix it by adding the missing direct relationship (BRANCH Holds ACCOUNT).

## Notation
COM106 uses **Chen** notation. Connolly and Begg use **UML**, and you will also see **Crow's foot**.

## Steps to draw an ER diagram
1. Identify entity types (nouns), their attributes and identifiers.
2. Identify relationships (verbs) and any relationship attributes.
3. Decide the cardinality ratio of each relationship.
4. Decide the participation of each entity in each relationship.
5. Combine everything into the diagram.

## Special cases from the labs
- **Two relationships between the same entities** (FLIGHT Departs_from AIRPORT and Arrives_at AIRPORT) each need their own named diamond.
- **Recursive (unary)** relationship: EMPLOYEE Supervises EMPLOYEE. Label both ends with roles (supervisor, supervisee). It maps to an FK in EMPLOYEE that refers to EMPLOYEE's own PK.
- An attribute that depends on two entities at once (quantity of a product on an order) belongs to the **relationship**, and becomes a column in the link table.
- An **associative entity** such as RENTAL records the details of an event that belong to no single other entity.
`,

  notes: `
## Three steps
1. **Create a relation for each entity type.** The entity identifier becomes the primary key.
2. **Link the tables using the mapping rules**: either copy primary keys into other tables as foreign keys, or create link tables (relationship relations).
3. **Complete the relations**: remove derived attributes, add "active attributes" to link tables, remove unnecessary tables.

## Two ways to link tables
| | Key copying | Link table |
|---|---|---|
| How | Copy (post) a PK into another table as an FK | New table whose PK combines both PKs |
| Extra tables | None, so no extra join overhead | One more table and join |
| M:N? | Not possible | Required |
| NULLs | May create NULL FKs when participation is partial | Reduces NULLs |

Where possible, reduce NULLs by design.

## The mapping rules
- **1:1**: copy the PK of **either** table into the other as an FK, **but not both**. The FK must hold **unique** values.
- **1:N**: copy the PK of the **"1" side** into the **"N" side** as an FK. The FK will (and should) contain duplicates.
- **M:N**: create a **link table** named after the relationship, whose PK is the **composite** of both PKs. Add any active attributes. (An artificial «id» PK is an alternative.)

### Examples
~~~
DEPARTMENT Employs EMPLOYEE (1:N)
  DEPARTMENT (dno, dname)
  EMPLOYEE   (eno, ename, salary, dno*)

WARD Contains PATIENT (1:N)
  WARD    (wardnum, wname)
  PATIENT (patnum, pname, wardnum*)

EMPLOYEE Assigned CAR (1:1)
  EMPLOYEE (enum, ename)
  CAR      (regnum, make, model, enum*)   -- enum must be unique

SUPPLIER Ships PART (M:N)
  SUPPLIER (sno, supp_name)
  PART     (pno, part_name)
  SHIPS    (sno*, pno*, quantity)         -- PK is (sno, pno)
~~~

In SHIPS, «sno» and «pno» both repeat. Effectively SUPPLIER to SHIPS is 1:N and PART to SHIPS is 1:N.

If CAR only ever held «regnum», you could drop the CAR entity and keep «regnum» as an attribute of EMPLOYEE.

## Completing the relations
- **Remove derived attributes**: total cost, pension contribution and so on are calculated in queries and reports.
- **Add active attributes** to link tables: usually amounts or dates, e.g. «mark» in «SITS (student_num*, exam_code*, mark)», or «role» and «duration» in «WORKS (eno*, pno*, role, duration)».
- **Remove unnecessary tables**: in «EMPLOYEE (eno, ename)», «AWARDED (eno*, qual*)», «QUALIFICATION (qual)», QUALIFICATION adds nothing because «qual» is already in AWARDED, so drop it.

## The projemp schema used in the labs
~~~
DEPT  (dno, dname, location)
EMP   (eno, ename, salary, age, supno, dno*)
WORKS (eno*, pno*, role, duration)
PROJ  (pno, pname, ptype, budget)
~~~

  id: 'db5', week: 4, title: 'Normalisation',
  summary: 'UNF to 1NF, 2NF and 3NF. Update anomalies, functional, partial and transitive dependencies, and non-loss decomposition.',
  notes: `
## What and why
**Normalisation** organises data in a relational database to **reduce redundancy and improve integrity**, by decomposing large tables into smaller, well-structured ones linked by keys.

Desirable properties: the minimal number of attributes; closely related attributes (functional dependencies) in the same table; minimal redundancy, so each attribute appears once except foreign keys.

It can be a bottom-up design technique on its own, but in big systems it is used to **validate** the schema produced by ER modelling and mapping. For implementation a database should be at least in **3NF**.

## UNF and 1NF
- A **repeating group** is a column (or set of columns) that stores several values for one entity, e.g. «paper_list = Times, Telegraph».
- A table with repeating groups is in **Unnormalised Form (UNF)**. Schemas show repeating groups in braces: «PET (pet_id, pet_name, …, {visitdate, procedure_no, procedure_name})».
- **1NF**: a flat table where each cell holds exactly one value, each column has a unique name, each row is unique (usually via a PK) and there are **no repeating groups**.

## Update anomalies (why 1NF is not enough)
«STAFFBORROWER (sno, name, dept, grade, salary, bno, date_out)»
- **Modification anomaly**: Smith changes grade, so every row for Smith must change, and one might be missed.
- **Insertion anomaly**: a new grade 2.8 earning £27,491 cannot be recorded until someone is on it, because the PK would be NULL (breaking entity integrity).
- **Deletion anomaly**: when Smith returns all her books, deleting her loan rows deletes all trace of Smith.

The fix is a **non-loss decomposition (NLD)**: split the table into projections that can be joined back to give exactly the original, no more and no less.

## Functional dependency
Y is **functionally dependent** on X (written **X → Y**, "X determines Y") if each X value is associated with exactly one Y value. X is the **determinant**, a potential PK of its own table. FDs come from the meaning of the data, not from one sample. The reverse does not follow: X → Y does not mean Y → X.

## 2NF: remove partial dependencies
A **partial dependency** is a non-key attribute that depends on only **part** of a composite PK.

«TAKES (Studentnum, StudentName, ModuleCode, ModuleName, ExamResult)», PK (Studentnum, ModuleCode):
~~~
Studentnum, ModuleCode -> ExamResult     (full)
Studentnum             -> StudentName    (partial)
ModuleCode             -> ModuleName     (partial)
~~~
Decompose so every determinant becomes a PK in its own table:
~~~
STUDENT (Studentnum, StudentName)
MODULE  (ModuleCode, ModuleName)
RESULT  (Studentnum*, ModuleCode*, ExamResult)
~~~
**2NF**: in 1NF and every non-key attribute is **fully** dependent on the whole PK. If the PK is a single attribute, a 1NF table is automatically in 2NF (move straight to checking 3NF).

## 3NF: remove transitive dependencies
If X → Y and Y → Z (and Y does not determine X), then X → Z is a **transitive dependency**. It shows up as a dependency **between non-key attributes**.

«EMP (empno, ename, salary, deptnum, dname)»: «deptnum → dname», so «empno → dname» is transitive. Split into «EMP (empno, ename, salary, deptnum*)» and «DEPT (deptnum, dname)».

**3NF**: in 2NF and every non-key attribute is non-transitively, fully dependent on the PK. A 2NF table with zero or one non-key attribute is already in 3NF.

A memory aid: every non-key attribute depends on **the key, the whole key, and nothing but the key**.

## Dependency diagrams
Draw the PK on the left in a box, arrows to the attributes it determines. Partial dependencies come from one part of a composite key; transitive ones are shown with a **dashed** arrow. Only draw them for a table that breaks a normal form, and the decomposition must match the arrows.

## Worked example: order form
~~~
UNF  ORDERFORM (orderno, orderdate, deldate, custno, custname, custphone,
                {partno, pname, unitcost, quantity})
1NF  ORDER       (orderno, orderdate, deldate, custno, custname, custphone)
     ORDEREDPART (orderno*, partno, pname, unitcost, quantity)
2NF  partno -> pname, unitcost is partial, so:
     PART          (partno, pname, unitcost)
     ORDEREDPART_1 (orderno*, partno*, quantity)
3NF  custno -> custname, custphone is transitive in ORDER, so:
     ORDER    (orderno, orderdate, deldate, custno*)
     CUSTOMER (custno, custname, custphone)
~~~
Final 3NF schema: ORDER, CUSTOMER, PART, ORDEREDPART_1.

## Denormalisation
Normalisation ignores efficiency. If a table is rarely updated but often read, you might leave it in 2NF to avoid join overhead (e.g. «EMPLOYEE (empno, address, postcode)»). Beyond 3NF there are BCNF, 4NF, 5NF and 6NF, which are outside this module.

## The usual design process
1. Draw the ER diagram.
2. Map it to a linked relational schema.
3. Check each table is in 3NF; decompose if not, or justify leaving it in 2NF for performance.
`,

  id: 'db6', week: 5, title: 'Introduction to SQL',
  summary: 'DDL, DML and DCL. CREATE TABLE with constraints, ALTER TABLE for foreign keys, INSERT, UPDATE, DELETE and basic SELECT queries.',
  notes: `
## What SQL is
SQL is a declarative language for managing data in a relational database. It is an ANSI standard with many dialects; SQL Server uses **Transact-SQL (T-SQL)**.

| Part | Purpose | Examples |
|---|---|---|
| **DDL** Data Definition Language | Create and destroy structures | «CREATE TABLE», «ALTER TABLE», «DROP» |
| **DML** Data Manipulation Language | Retrieve and change data | «SELECT», «INSERT», «UPDATE», «DELETE» |
| **DCL** Data Control Language | Permissions and users | «GRANT ALL ON EMP TO John WITH GRANT OPTION» |

Comparison operators: «=», «<>» (not equal), «>», «<», «>=», «<=».

## Common data types
| Type | Use |
|---|---|
| «char(n)» | Fixed-length text, entries of consistent size (slightly more efficient) |
| «varchar(n)» | Variable-length text, entries that vary a lot in size |
| «tinyint» | 0 to 255 |
| «smallint» | −32,768 to 32,767 |
| «int», «bigint» | Larger whole numbers |
| «decimal(p,s)» | Precision and scale, e.g. «decimal(7,2)» holds up to 99999.99 |
| «date» | e.g. «'1912-10-25'» |

A phone number or room code like «16C26» is text, not a number.

## Style guide
Table names and reserved words in CAPITALS; attribute names lowercase with underscores; one clause per line.

## Creating tables
~~~
CREATE TABLE EMPLOYEE (
  enum   int not null,
  ename  char(15),
  salary decimal(7,2),
  floor  tinyint,
  CONSTRAINT pk_emp PRIMARY KEY (enum)
);

CREATE TABLE WORKS_ON (
  enum int not null,
  pnum smallint not null,
  role char(15),
  CONSTRAINT pk_wo PRIMARY KEY (enum, pnum)
);
~~~

## Constraints
- «NOT NULL» and «PRIMARY KEY» (as above).
- «DEFAULT»: «role char(15) DEFAULT 'To be set'»
- «UNIQUE»: «leader char(15) UNIQUE»
- «CHECK»: «floor tinyint CHECK (floor <= 7)»
- «FOREIGN KEY», usually added with ALTER TABLE.

## Foreign keys and other ALTER TABLE commands
~~~
ALTER TABLE WORKS_ON
ADD CONSTRAINT fk_wo1 FOREIGN KEY (enum) REFERENCES EMPLOYEE (enum);

ALTER TABLE EMPLOYEE ALTER COLUMN salary int;     -- change a type
ALTER TABLE PROJECT  ADD budget decimal(9,2);     -- add a column
ALTER TABLE PROJECT  DROP COLUMN budget;          -- remove a column
ALTER TABLE WORKS_ON DROP CONSTRAINT fk_wo2;      -- drop the FK first…
ALTER TABLE PROJECT  DROP CONSTRAINT pk_proj;     -- …then the PK it references
~~~
Naming constraints lets you drop them later by name.

## Adding, deleting and changing rows
~~~
INSERT INTO EMPLOYEE (enum, ename, salary, floor)
VALUES (852559, 'Brown', 18000, 4);
-- attribute list optional when supplying a whole record

DELETE FROM EMPLOYEE
WHERE salary > 18000
AND floor = 2;

UPDATE PROJECT
SET leader = 'Branagh'
WHERE pname = 'Theatre';
~~~
- Text values need single quotes; numbers do not.
- A DELETE or UPDATE with no WHERE affects **every row**.
- **Referential integrity applies**: you cannot add an employee to a department that does not exist yet, and you cannot delete a row other rows still reference.

## Retrieving data (projemp)
~~~
SELECT * FROM EMP;                                  -- every column, every row
SELECT ename, age FROM EMP WHERE dno = 'd1';
SELECT eno, ename FROM EMP WHERE age > 30 AND dno = 'd2';
SELECT ename FROM EMP WHERE salary < 20000 OR salary > 30000;
SELECT COUNT(*) AS num_employees FROM EMP WHERE dno = 'd3';
SELECT SUM(salary) FROM EMP WHERE dno = 'd1';
SELECT ename, salary FROM EMP ORDER BY salary ASC;
SELECT ename FROM EMP WHERE salary IN (18000, 20000);
~~~
- «*» means all attributes; inside a function it only works as «COUNT(*)».
- «AS» names a result column (no spaces in the name).
- «ORDER BY … ASC» or «DESC».
- «IN (…)» is shorthand for several «OR =» tests.
- Put «USE projemp;» first so the query runs against the right database.

## Joining tables (seen in normalisation)
~~~
SELECT *
FROM STUDENT, RESULT, MODULE
WHERE STUDENT.Studentnum = RESULT.Studentnum
AND RESULT.ModuleCode = MODULE.ModuleCode;
~~~

  summary: 'Hardware and software, the CPU and fetch-decode-execute, machine code, compilers vs interpreters, and how Python runs your code.',
  notes: `
## Software
A **program** is a set of instructions the computer (hardware) executes to perform a task. A **programmer** designs, creates and tests programs.
- **Application software**: everyday tasks (word processing, email, games, browsers).
- **System software**: controls and manages the computer. Includes the **operating system**, **utility programs** and **software development tools**.

## The CPU
The **Central Processing Unit** is the most important hardware component. It performs simple operations on data (read, write, add, subtract, multiply, divide) and only understands **machine language** for its own instruction set.

Programs are copied from secondary storage into **RAM** to run, and the CPU repeats the **fetch → decode → execute** cycle.

## Machine language and beyond
- Machine code is binary: «1001 1110 0000 1010» is 9, 14, 0, 10, or «9E0A» in hexadecimal (each group of four bits is one hex digit).
- **Assembly language** is low-level and close to machine code.
- **High-level languages** (like Python) are closer to English. Their parts: **key words** (reserved words), **operators**, **syntax** (the rules), and **statements** (individual instructions).

## Compilers and interpreters
Every high-level program must be translated into machine language.
| | Compiler | Interpreter |
|---|---|---|
| How | Translates the whole program into a separate machine-language program | Translates and executes one instruction at a time, each time it runs |
| Output | An executable you can run any time | No separate machine-language program |

Python is usually called **interpreted**, but more precisely it compiles source code to **bytecode**, which the **Python Virtual Machine** then interprets. You never run the compiler yourself.

**Source code** is what the programmer writes. A **syntax error** stops code being translated.

## The big four of programming
**Input** (keyboard), **processing** (calculations), **output** (screen), plus **variables** to store data.

## Running Python
- **Interactive mode**: type statements at the «>>>» prompt. Good for trying things; nothing is saved.
- **Script mode**: save statements in a file ending **.py** and run «python filename.py».
- **IDEs** (IDLE, PyCharm, VS Code, Replit) add formatting, colour coding, code completion and debugging. COM161 moves from IDLE to **PyCharm** in week 5.

## Python facts
Created by **Guido van Rossum** (started 1989, named after Monty Python). Python 3 arrived in 2008. Used by Google, NASA, YouTube, Dropbox, Instagram, Spotify, Netflix and in data science.

## Asking GOOD questions
- **G**ive context on what you are trying to do.
- **O**utline what you have already tried.
- **O**ffer your best guess at the problem.
- **D**emo it: the code, the traceback and the steps that caused it.

## COM161 assessment
- Formative progress tests in the **week 3 and week 5** labs (mandatory).
- **Class Test 1 (40%)** in week 7: about 35 multiple-choice questions, about 90 minutes, closed book but study notes allowed.
- **Class Test 2 (60%)** in week 13: practical coding under exam conditions, about 12 to 15 questions, 90 minutes. Practice tasks are released in week 8.

  id: 'py2', week: 2, title: 'Input, processing and output',
  summary: 'Designing with pseudocode and flowcharts, print, variables, data types, input and type conversion, operators, formatting output and named constants.',
  notes: `
## Designing a program
Program development cycle: requirements gathering → analysis and specification → **design** → implementation (coding) → testing and integration → deployment and maintenance.

An **algorithm** is a set of well-defined logical steps to perform a task. Two design tools:
- **Pseudocode**: informal "fake code" with no strict syntax, focused on the logic. It is not executed.
- **Flowcharts**: diagrams with standard symbols.

| Symbol | Shape | Use |
|---|---|---|
| Terminal | Oval / rounded box | Start and end |
| Input/Output | Parallelogram | Reading input, displaying output |
| Process | Rectangle | Calculations, data changes |
| Decision | Diamond (rhombus) | A yes/no choice |
| Flow line | Arrow | Order of steps |

~~~
BEGIN
  pay_rate = 7.88
  INPUT hours_worked
  gross_pay = hours_worked * pay_rate
  DISPLAY gross_pay
END
~~~
**GIGO**: Garbage In, Garbage Out. Output is only as good as the input.

## Output with print
A **function** is prewritten code that performs an operation. You **call** it and pass **arguments**.
~~~
print('Hello')                    # Hello
print('Room', room_num)           # items separated by a space
print('One', 'Two', sep='*')      # One*Two
print('One', end='')              # no newline at the end
print('Thur\\tFri\\tSat')         # \\t tab, \\n newline, \\' quote, \\\\ backslash
~~~

## Strings and comments
- A **string** is a sequence of characters. A **string literal** appears in code inside single, double or triple quotes. Triple quotes can hold both kinds of quote and span lines.
- **Comments** start with «#» and are ignored by Python. Use them.

## Variables
A **variable** is a name that references a value in memory. Create one with an **assignment statement**: «age = 29». The variable goes on the **left**.
- You must assign a value before you use a variable, otherwise «NameError».
- «37 = age» is a «SyntaxError» (you cannot assign to a literal).
- Variables can be reassigned, even to a different type. Values no longer referenced are removed by **garbage collection**.

### Naming rules
- Not a keyword; no spaces; first character a letter or underscore; then letters, digits or underscores; **case sensitive**.
- Choose descriptive names. Python style is **snake_case** («gross_pay»), not camelCase.

## Data types
| Type | Example | Notes |
|---|---|---|
| «int» | «7» | No decimal point |
| «float» | «7.0» | Has a decimal point |
| «str» | «'7'» | Text |
| «bool» | «True» | True or False |
«type(1.0)» returns «<class 'float'>». Numeric literals cannot contain £, spaces or commas.

## Reading input
«input(prompt)» **always returns a string**. Convert it:
~~~
hours = int(input('How many hours did you work? '))
income = float(input('What is your income? '))
~~~
If the text cannot be converted (e.g. «int('abc')»), Python raises an **exception** (ValueError) and the program stops.

A classic logic error: «x + y» on two input strings **joins** them ("3" + "4" = "34") instead of adding.

## Operators and precedence
| Operator | Meaning | Example | Result |
|---|---|---|---|
| «+ - *» | add, subtract, multiply | «3 * 4» | 12 |
| «/» | division (always float) | «7 / 2» | 3.5 |
| «//» | integer (floor) division | «7 // 2» | 3 |
| «%» | remainder (modulus) | «7 % 2» | 1 |
| «**» | exponent | «2 ** 3» | 8 |

Precedence: brackets → «**» → «* / // %» → «+ -». Equal precedence goes left to right.
- int with int gives int (except «/»); float with float gives float; mixing gives float.
- «int(2.9)» gives 2: converting float to int **truncates**.
- Break long lines with «\\» or inside brackets.

## Formatting numbers
~~~
format(416.6666, '.2f')       # '416.67'
format(4166.66, ',.2f')       # '4,166.66'
format(127.899, '7.2f')       # ' 127.90' (width 7)
format(123456, ',d')          # '123,456'  (d for integers)
format(0.5, '%')              # '50.000000%'
pi = 3.14159
print(f'Pi is about {pi:.2f}')   # f-string, Python 3.6+
~~~

## Magic numbers and named constants
A **magic number** is an unexplained value in code («balance * 0.069»). Replace it with a **named constant** in capitals: «INTEREST_RATE = 0.069». Constants are self-documenting, easier to change in one place, and avoid typos.

## PEP 8 style
Python's style guide. Indentation marks blocks (use spaces, never mix tabs and spaces), lines up to **79 characters**, avoid unnecessary whitespace, block comments start with «# ». "Code is more often read than written."

  notes: `
## Control structures
Until now programs were **sequence structures**: statements run in order. A **decision structure** (selection) runs some statements only when a condition is true.

## if
~~~
if condition:
    statement      # indented block runs only when the condition is True
    statement
~~~
The condition is a **Boolean expression**: it evaluates to «True» or «False». Indentation marks the block.

## Relational operators
| Operator | Meaning |
|---|---|
| «>» «<» | greater / less than |
| «>=» «<=» | greater / less than or equal |
| «==» | equal to (two equals signs!) |
| «!=» | not equal to |

## if-else (dual alternative)
~~~
mark = int(input('Enter mark: '))
if mark >= 40:
    print('Pass')
else:
    print('Fail')
~~~
«if» and «else» must line up.

## Nested decisions and if-elif-else
~~~
if salary >= 30000:
    if years_on_job >= 2:
        print('You qualify for the loan.')
    else:
        print('You must have been employed for at least 2 years.')
else:
    print('You must earn at least £30,000 per year.')

if score >= 90:
    print('A')
elif score >= 80:
    print('B')
elif score >= 70:
    print('C')
elif score >= 60:
    print('D')
else:
    print('F')
~~~
**Order matters** in an elif chain: Python takes the first true branch and skips the rest.

## Logical operators
| Expression | True when |
|---|---|
| «a and b» | both are true |
| «a or b» | at least one is true |
| «not a» | a is false |

Truth tables:
| P | Q | P and Q | P or Q |
|---|---|---|---|
| F | F | F | F |
| F | T | F | T |
| T | F | F | T |
| T | T | T | T |

**Short-circuit evaluation**: with «or», if the left side is True the right side is not checked; with «and», if the left side is False the right side is not checked.

**Ranges**: inside a range «x >= 10 and x <= 20»; outside a range «x < 10 or x > 20».

De Morgan: «not (P or Q)» equals «(not P) and (not Q)», and «not (P and Q)» equals «(not P) or (not Q)».

## Comparing strings
- «==» and «!=» work on strings and are **case sensitive** ('Mary' != 'mary').
- «< > <= >=» compare **character by character using ASCII codes**: 'A' is 65, 'a' is 97, space is 32. So 'Z' < 'a', and 'Mary' > 'Mark' because 'y' (121) > 'k' (107).
- If one string is the start of the other, the longer one is greater: 'High' < 'Hello'? No: 'i' > 'e', so 'High' > 'Hello'. But 'Hell' < 'Hello'.

## Boolean variables (flags)
A «bool» variable holds «True» or «False». It is often used as a **flag** that signals a condition: «sales_quota_met = sales >= 50000».

## Ternary operator (conditional expression)
~~~
status = 'Adult' if age >= 18 else 'Minor'
~~~

## Walrus operator «:=»
Assigns a value **and** returns it, so you can assign inside a condition. It has the **lowest precedence**, so wrap it in brackets.
~~~
if (area := width * height) > 100:
    print(f'The area equals {area}, which is too large')
~~~

## Formatting numbers with f-strings
| Spec | Example | Result |
|---|---|---|
| «,d» | «f"{12345678:,d}"» | 12,345,678 |
| «10d» | width 10 | '  12345678' |
| «.4f» | «f"{math.pi:.4f}"» | 3.1416 |
| «08.4f» | zero padded, width 8 | 003.1416 |

## Turtle: checking state
«turtle.xcor()», «turtle.ycor()», «turtle.heading()», «turtle.isdown()», «turtle.isvisible()», and «turtle.pencolor()», «turtle.fillcolor()», «turtle.bgcolor()», «turtle.pensize()», «turtle.speed()» called with no argument return the current value, so you can test them in an «if».

## AI in focus (week 3)
AI output is a **proposal, not an authority**. Vague prompts make the AI fill in missing requirements with assumptions. Working code is not necessarily correct code (the AI might write «mark > 40» when the rule is "40 or above"). **Never submit code you cannot explain.**

  id: 'py4', week: 4, title: 'Loops',
  summary: 'while and for loops, range, counters and accumulators, sentinels, input validation, nested loops, break, continue and the loop else clause.',
  notes: `
## Why loops?
Writing the same code again and again makes programs long, slow to write and hard to change. A **repetition structure** repeats code as needed.
- **Condition-controlled** loops repeat while a condition is true: «while».
- **Count-controlled** loops repeat a set number of times: «for».

## The while loop
~~~
while condition:
    statements
~~~
- A **pretest** loop: the condition is checked **before** each iteration, so the body may run zero times.
- Something in the body must eventually make the condition False, or you get an **infinite loop**.
- An **iteration** is one execution of the body.

~~~
keep_going = 'y'
while keep_going == 'y':
    sales = float(input('Sales: '))
    print(f'Commission: £{sales * 0.10:.2f}')
    keep_going = input('Another? (y): ')
~~~

### while as a counter loop: initialise, compare, update
~~~
n = 0              # initialisation
while n < 5:       # comparison
    print(n)
    n += 1         # update
~~~

## The for loop
~~~
for variable in [1, 2, 3]:
    statements
~~~
The **target variable** takes each value in the sequence in turn.

### range
| Call | Values |
|---|---|
| «range(5)» | 0, 1, 2, 3, 4 |
| «range(3, 8)» | 3, 4, 5, 6, 7 |
| «range(2, 11, 2)» | 2, 4, 6, 8, 10 |
| «range(10, 0, -1)» | 10, 9, … 1 |
The stop value is **never included**. A negative step counts down (start must be larger than stop).

## for or while?
- **for**: the number of iterations is known or the data is a sequence (a range, list or string). It stops by itself.
- **while**: you do not know how many times (waiting for valid input, a game until correct). Risk of infinite loops.

## Running totals
Use an **accumulator** initialised to 0 before the loop:
~~~
total = 0
for counter in range(5):
    number = int(input('Enter a number: '))
    total += number
print('The total is', total)
~~~

## Augmented assignment
| Operator | Same as |
|---|---|
| «x += 2» | «x = x + 2» |
| «x -= 2» | «x = x - 2» |
| «x *= 2» | «x = x * 2» |
| «x /= 2» | «x = x / 2» |
| «x //= 2», «x %= 2», «x **= 2» | likewise |

## Sentinels
A **sentinel** is a special value that marks the end of a sequence (e.g. 0 or an empty line). It must be distinctive enough not to be mistaken for real data.

## Input validation loops
**Input validation** checks input before it is used. A validation loop (error trap) repeats while the input is bad:
~~~
score = int(input('Enter a score: '))      # priming read
while score < 0 or score > 100:
    print('Score must be 0 to 100.')
    score = int(input('Enter a score: '))
~~~
With the walrus operator:
~~~
while (score := int(input('Enter your score: '))) < 0:
    print('The score cannot be negative.')
~~~

## Nested loops
The inner loop completes **all** its iterations for **each** iteration of the outer loop. Total iterations = outer × inner.
~~~
rows = int(input('Rows: '))
cols = int(input('Columns: '))
for r in range(rows):
    for c in range(cols):
        print('*', end='')
    print()
~~~

## break, continue and else
- «break» ends the loop immediately.
- «continue» skips the rest of this iteration and moves to the next.
- A loop's «else» block runs only if the loop finished **without** hitting «break».

~~~
n = 0
while n < 10:
    n += 1
    if n % 3 == 0:
        continue
    print(n)          # prints 1 2 4 5 7 8 10
~~~

## match-case (Python 3.10+)
An alternative to long if-elif chains:
~~~
match choice:
    case '1':
        print('You selected option 1.')
    case '5':
        print('Exiting.')
    case other:
        print('Invalid selection.')
~~~

## Turtle with loops
~~~
for x in range(4):        # square
    turtle.forward(100)
    turtle.right(90)
~~~
A regular polygon of n sides turns «360 / n» degrees each time. Drawing a shape repeatedly while turning a small angle makes rosette designs.

## AI in focus (week 4)
- The **4 pillars of a code prompt**: **Context**, **Task**, **Constraints**, **Format**.
- **Zero-shot** (just tell), **one-shot** (one example), **few-shot** (several examples).
- **Chain of Thought**: ask the model to reason step by step before writing code.
- **Prompt chaining**: break a big job into a sequence of prompts (pseudocode → code → tests → refine).
- **Socratic prompting**: ask the AI to question you instead of giving the answer.
- **Verify**: inspect code, trace boundary values, ask for edge-case tests.

  notes: `
## What a function is
A **function** is a block of code the program calls when needed. Data can be passed in and a value can be returned. Giving each task its own function is **modularisation**.

### Why
**DRY: Don't Repeat Yourself.** Repeated code makes programs longer, harder to read and debug, harder to update (you must change every copy) and more prone to typos.

## Defining and calling
~~~
def print_hello():          # def = define; brackets are required
    print('Hello')
    print('World')

print('Start')
print_hello()               # call: the function only runs when called
print('End')
~~~
Python reads and remembers the definition, then runs the unindented code. A call jumps into the function and comes back to the next line afterwards.

Naming rules are the same as variables (no keywords, no spaces, start with a letter or underscore, case sensitive). Use meaningful names such as «calculate_pay».

## The main function
Good practice: put the program's main logic in «main()», and have just **one line** at the bottom that calls it. Functions can call other functions (and themselves: **recursion**).
~~~
def main():
    show_menu()
    process_choice()

def show_menu():
    ...

main()
~~~

## Designing with functions
- **Top-down design**: break the task into subtasks, break those down further until nothing sensible is left, then write the code.
- **Hierarchy (structure) chart**: shows which functions call which.
- In a **flowchart**, a function call is a rectangle with vertical bars at each side, and each function gets its own flowchart.

## Void vs value-returning functions
- A **void function** runs its statements and stops. It returns nothing useful.
- A **value-returning function** sends a value back with «return». «input()» is one; «print()» is void.
~~~
def square(number):
    return number * number

result = square(4)          # 16
~~~

## Parameters and arguments
- A **parameter** is the variable in the brackets of the **definition**.
- An **argument** is the value passed in the **call**.
~~~
def print_details(name, age):       # parameters
    print(name, 'is', age)

print_details('Adam', 19)           # arguments, matched by position
print_details(age=19, name='Adam')  # keyword arguments, any order
~~~
Arguments are matched by position unless you use **keyword arguments**. The number of arguments must match the number of parameters.

## Scope
- **Local variables** are created inside a function and only exist there. Two functions can each have a variable called «total» without clashing.
- **Global variables** are created outside all functions and visible everywhere. Avoid them: they make programs hard to follow. Pass values in as arguments instead.
- The exception is **global constants**, e.g. «VAT_RATE = 0.2» at the top of the file.

## Modules and dot notation
Library functions live in **modules**, which you import first: «import random», «import turtle», «import math». Call them with **dot notation**: «random.randint(1, 20)», «turtle.pencolor('blue')», «math.sqrt(16)».

## Boolean functions
A function can return «True» or «False», which reads nicely in an «if»:
~~~
def is_even(number):
    return number % 2 == 0

if is_even(n):
    print('even')
~~~

  notes: `
## LLMs in one paragraph
A **Large Language Model** (ChatGPT, Claude, Gemini) is trained on huge amounts of text and generates text by predicting what comes next. It does not think like a human, it can produce confident but wrong answers (**hallucinations**), and the quality of its answer depends heavily on your prompt.

## Prompt vs prompt engineering
- A **prompt** is the instruction or question you give the AI.
- **Prompt engineering** is designing and refining prompts (and the whole interaction) to get better, more reliable results: break tasks down, give examples, specify format and constraints, iterate and test.
- "Prompting is asking the question; prompt engineering is designing the interaction."

Template from the tutorial: **"Act as a [role]. Do [task]. Here is the [context]. Follow these [constraints]. Present the answer as [output]."**

## The 4 pillars of a code prompt
| Pillar | Question |
|---|---|
| **Context** | Who are you and what are you building? |
| **Task** | What exact action must the AI take? |
| **Constraints** | Rules, required Python features, things to avoid |
| **Format** | Pure code, inline comments, docstrings, example output |
Clearer instructions reduce assumptions, but they do not guarantee correctness.

## Shots
- **Zero-shot**: just tell it what to do.
- **One-shot**: tell it and give one example.
- **Few-shot**: give several examples covering different cases.

## Four "flavours"
1. **Chain of Thought (CoT)**: ask the model to reason step by step ("explain the algorithm in bullet points, do not write code until the logic is complete"). Logic first, code second. One prompt; makes the logic visible.
2. **Prompt chaining**: a human-guided sequence of prompts where each output feeds the next: pseudocode → Python → test cases → refine with error handling. Reduces cognitive load and truncated or buggy output.
3. **Socratic role prompting**: "Act as a strict Python lab assistant… do NOT give me the corrected code; ask me two guiding questions." The AI tutors instead of answering.
4. **Dynamic prompting**: build prompts as f-strings inside your program.

## Verify everything
AI output is a **proposal, not an authority**. Ask yourself: did I specify the requirements clearly? Does the output meet them? Does it work? How can I test it? Can I explain it?
- Inspect the code, trace boundary values, and prompt the AI for edge-case tests (e.g. "generate 5 test cases including boundary values, zero and negative inputs").
- Ask it to explain a traceback in plain English before changing your code.
- **Never submit code you cannot explain.**

## Why the module covers AI
Industry wants developers who can review code and know the requirements, not people who paste in output. In previous years students used AI badly (printouts of chats, unable to change generated code). You may also work on projects where AI is not allowed.

window.BANK = {"db1": {"cards": [{"id": "com106-w1-database-basics-fc01", "q": "What is a database?", "a": "A shared collection of logically related data, stored in an organised structure, that lets you interact with the data and extract useful information and knowledge."}, {"id": "com106-w1-database-basics-fc02", "q": "Put these in order: Wisdom, Data, Knowledge, Information", "a": "Data → Information → Knowledge → Wisdom. Data is disorganised, information is related data, knowledge is extracted from related data, and wisdom is the decisions based on knowledge."}, {"id": "com106-w1-database-basics-fc03", "q": "What does 'logically related data' mean?", "a": "Data that makes sense together because it describes one coherent system, entity or activity."}, {"id": "com106-w1-database-basics-fc04", "q": "Name four problems with file-based systems.", "a": "Any four of: no data centralisation (isolation), data duplication/redundancy, loss of integrity when updating copies, data dependence, programs need to know the file structure, incompatible file formats, file-level (not item-level) security, limited queries."}, {"id": "com106-w1-database-basics-fc05", "q": "What is a DBMS?", "a": "A Database Management System: software that manages a database, allowing creation, manipulation (queries) and maintenance of data, and providing controlled access (security, integrity, recovery)."}, {"id": "com106-w1-database-basics-fc06", "q": "What two things does data integrity cover?", "a": "Consistency (is duplicate data identical?) and correctness (is the stored data accurate?)."}, {"id": "com106-w1-database-basics-fc07", "q": "What is a data dependency?", "a": "When knowing the value of one piece of data is enough to tell you the value of another in the same table or file. E.g. Dept# determines DName."}, {"id": "com106-w1-database-basics-fc08", "q": "Name the three levels of the ANSI-SPARC architecture.", "a": "External (views: programs, queries, reports), Conceptual (the database schema, e.g. linked tables) and Internal (physical storage and access paths)."}, {"id": "com106-w1-database-basics-fc09", "q": "Logical vs physical data independence?", "a": "Logical: changing applications/queries doesn't force changes to the tables. Physical: changing how records are stored doesn't force changes to the applications."}, {"id": "com106-w1-database-basics-fc10", "q": "What is a transaction?", "a": "One or more atomic, sequential operations that make up a single task, e.g. an ATM withdrawal (read balance, update balance, create log entry)."}, {"id": "com106-w1-database-basics-fc11", "q": "What does CRUD stand for?", "a": "Create, Read (query), Update, Delete."}, {"id": "com106-w1-database-basics-fc12", "q": "List the four main database advantages over file handling.", "a": "Data independence, centralised data, access flexibility, and a data model that reflects the real world."}, {"id": "com106-w1-database-basics-fc13", "q": "Three disadvantages of a DBMS?", "a": "Complexity, cost (DBMS, conversion, maintenance) and higher impact of failure (downside of centralisation)."}, {"id": "com106-w1-database-basics-fc14", "q": "Name four data models.", "a": "Hierarchical, network, relational and object-oriented."}, {"id": "com106-w1-database-basics-fc15", "q": "What does NoSQL stand for, and why use it?", "a": "'Not only SQL'. Used when you need a flexible schema, huge amounts of unstructured or semi-structured data (big data), or when scaling matters more than consistency. Types: document, key-value, graph."}, {"id": "com106-w1-database-basics-fc16", "q": "What is a data dictionary (system catalog)?", "a": "Where the DBMS stores the definitions of all data objects, independent of the stored data."}, {"id": "com106-w1-database-basics-fc17", "q": "How is COM106 assessed?", "a": "100% coursework: Set Exercise 40% (90 minutes, in your lab, week 8) and Assignment 60% (design document + 10 minute screencast, week 12). Pass = 40% aggregated; no written exam."}], "mcq": [{"id": "com106-w1-database-basics-mcq01", "q": "Which best describes a database?", "o": ["Any file stored on a computer", "A program that runs SQL queries", "A disorganised collection of facts and figures", "A shared collection of logically related data stored in an organised structure"], "a": 3, "e": "Data on its own is disorganised. A database organises logically related data so it can be shared, queried and used to extract information."}, {"id": "com106-w1-database-basics-mcq02", "q": "Which is NOT a problem of the file-based approach?", "o": ["Data duplication", "Incompatible file formats", "Data independence", "Programs need knowledge of file storage structures"], "a": 2, "e": "Data independence is an ADVANTAGE of the database approach. File-based systems suffer from data dependence."}, {"id": "com106-w1-database-basics-mcq03", "q": "In the ANSI-SPARC architecture, which level describes how data is physically stored?", "o": ["Logical", "Internal", "External", "Conceptual"], "a": 1, "e": "The internal (physical) level defines how data is stored and the access paths to it."}, {"id": "com106-w1-database-basics-mcq04", "q": "Changing a table's storage structure without having to change applications is called…", "o": ["Physical data independence", "Data redundancy", "Logical data independence", "Referential integrity"], "a": 0, "e": "Physical independence: storage changes don't require application changes."}, {"id": "com106-w1-database-basics-mcq05", "q": "An ATM withdrawal checks the balance, reduces it, then logs the transaction. Which CRUD operations are used, in order?", "o": ["Read, Delete, Create", "Update, Read, Create", "Create, Update, Delete", "Read, Update, Create"], "a": 3, "e": "Check balance = Read, reduce balance = Update, log = Create."}, {"id": "com106-w1-database-basics-mcq06", "q": "Which DBMS is described in the lecture as single-user with a limited database size?", "o": ["MySQL", "Oracle", "Microsoft Access", "Microsoft SQL Server"], "a": 2, "e": "Access is single-user. SQL Server is multi-user, MySQL is free and used for web apps, Oracle is large-scale and expensive."}, {"id": "com106-w1-database-basics-mcq07", "q": "A table has columns Dept#, DName and Manager, where Dept# determines DName and DName determines Manager. Does knowing Manager uniquely identify DName?", "o": ["Yes, always", "Only if Manager is the primary key", "No, the reverse of a dependency isn't necessarily true", "Only in 3NF"], "a": 2, "e": "Dependencies are one-directional. One manager could manage more than one department."}, {"id": "com106-w1-database-basics-mcq08", "q": "Which is a DISADVANTAGE of a DBMS?", "o": ["Enforcement of standards", "Higher impact of failure", "Data sharing", "Economy of scale"], "a": 1, "e": "Centralising everything means a failure affects everything."}, {"id": "com106-w1-database-basics-mcq09", "q": "NoSQL databases are designed for situations where…", "o": ["Only one user accesses the data", "SQL must be used for every query", "Data must always be perfectly consistent", "You need a flexible schema and massive unstructured data"], "a": 3, "e": "NoSQL suits flexible schemas, big data, and cases where scaling matters more than consistency."}, {"id": "com106-w1-database-basics-mcq10", "q": "To pass COM106 you need…", "o": ["40% in each component", "40% or more aggregated over both components", "50% overall", "To pass the written exam"], "a": 1, "e": "It is not necessary to pass each component separately, and there is no written exam."}], "blanks": [{"id": "com106-w1-database-basics-fib01", "t": "A {{DBMS|database management system}} is a software system for managing databases that allows creation, manipulation and maintenance of data.", "e": "DBMS = Database Management System."}, {"id": "com106-w1-database-basics-fib02", "t": "Data integrity is concerned with {{consistency}} (is duplicate data identical?) and {{correctness}} (is the stored data accurate?).", "e": "Both must hold for data to have integrity."}, {"id": "com106-w1-database-basics-fib03", "t": "The three ANSI-SPARC levels are external, {{conceptual}} and internal.", "e": "The conceptual level is the database schema."}, {"id": "com106-w1-database-basics-fib04", "t": "A {{transaction}} is one or more atomic sequential operations that make up a single task.", "e": "Transactions follow CRUD operations: Create, Read, Update, Delete."}, {"id": "com106-w1-database-basics-fib05", "t": "NoSQL stands for '{{Not only SQL|not only sql}}'.", "e": "NoSQL systems include document stores, key-value stores and graph databases."}, {"id": "com106-w1-database-basics-fib06", "t": "Poor file design can lead to data duplication, also called data {{redundancy}}.", "e": "Redundant copies are hard to keep consistent."}, {"id": "com106-w1-database-basics-fib07", "t": "The description of the database structure is the database {{schema}}, like a blueprint.", "e": "Each ANSI-SPARC level is defined by a schema."}]}, "db3": {"cards": [{"id": "com106-w2-er-modelling-intro-fc01", "q": "Name the five database development stages.", "a": "Data Investigation → Data Modelling → Database Conceptual Design → Database Implementation → Security, Monitoring and Tuning."}, {"id": "com106-w2-er-modelling-intro-fc02", "q": "What is the end result of Data Investigation?", "a": "An outline Data Dictionary (attributes with sample values, source, usage)."}, {"id": "com106-w2-er-modelling-intro-fc03", "q": "ER modelling vs normalisation: which is top-down?", "a": "ER modelling is top-down (generalising entities/relationships). Normalisation is bottom-up."}, {"id": "com106-w2-er-modelling-intro-fc04", "q": "Three steps of designing a database?", "a": "1. Draw an ER diagram. 2. Map it to a relational schema. 3. Check each table is in 3NF (normalisation)."}, {"id": "com106-w2-er-modelling-intro-fc05", "q": "What is an entity type?", "a": "A group of objects with the same properties that the enterprise sees as important, uniquely identifiable, and described by more than one attribute."}, {"id": "com106-w2-er-modelling-intro-fc06", "q": "Entity type vs entity occurrence?", "a": "The type is the category (e.g. EMPLOYEE). An occurrence is one uniquely identifiable instance of it."}, {"id": "com106-w2-er-modelling-intro-fc07", "q": "ER diagram symbols (Chen notation): entity and relationship?", "a": "Entity = labelled rectangle. Relationship = labelled diamond between entities."}, {"id": "com106-w2-er-modelling-intro-fc08", "q": "Three questions to decide if a noun should be an entity?", "a": "Is there more than one instance? Are the instances not fixed (unlike days of the week)? Is anyone actually interested in them?"}, {"id": "com106-w2-er-modelling-intro-fc09", "q": "Simple vs composite attribute?", "a": "Simple: a single component (e.g. part number). Composite: multiple components (e.g. date = day/month/year)."}, {"id": "com106-w2-er-modelling-intro-fc10", "q": "What is a derived attribute?", "a": "One whose value can be calculated from others, e.g. Total Cost = Quantity × Unit Cost."}, {"id": "com106-w2-er-modelling-intro-fc11", "q": "What is a multi-valued attribute?", "a": "An attribute that can hold several values, e.g. phone number."}, {"id": "com106-w2-er-modelling-intro-fc12", "q": "What is the degree of a relationship?", "a": "The number of participating entity types: unary, binary, ternary, etc."}, {"id": "com106-w2-er-modelling-intro-fc13", "q": "How do you find a cardinality ratio?", "a": "Consider the relationship in BOTH directions: does each A relate to at most one or many B, and vice versa?"}, {"id": "com106-w2-er-modelling-intro-fc14", "q": "What does an M:N relationship consist of?", "a": "Two 1:N relationships, one in each direction."}, {"id": "com106-w2-er-modelling-intro-fc15", "q": "Full vs partial participation?", "a": "Full (mandatory): every instance must take part in the relationship (double line). Partial (optional): some instances don't (single line)."}, {"id": "com106-w2-er-modelling-intro-fc16", "q": "Which participation constraint should you assume by default?", "a": "FULL, unless the spec or real-world knowledge says otherwise."}, {"id": "com106-w2-er-modelling-intro-fc17", "q": "How does recording history change DEPARTMENT Employs EMPLOYEE?", "a": "Current only = 1:N. Historic (all past departments) = M:N."}, {"id": "com106-w3-er-modelling-2-fc01", "q": "What is a connection trap?", "a": "A problem caused by misinterpreting the meaning of relationships in an ER model. The two main kinds are fan traps and chasm traps."}, {"id": "com106-w3-er-modelling-2-fc02", "q": "What is a fan trap?", "a": "When two related entities aren't directly connected and the path between them goes through two 1:N relationships fanning out from a central entity, making the connection ambiguous."}, {"id": "com106-w3-er-modelling-2-fc03", "q": "How do you resolve a fan trap?", "a": "Restructure the ER diagram so it shows the correct association between the entities."}, {"id": "com106-w3-er-modelling-2-fc04", "q": "What is a chasm trap?", "a": "When related entities aren't directly connected and the indirect path includes partial participation, so some related occurrences have no way to connect."}, {"id": "com106-w3-er-modelling-2-fc05", "q": "How do you resolve a chasm trap?", "a": "Add the missing relationship directly, e.g. a Holds relationship between BRANCH and ACCOUNT."}, {"id": "com106-w3-er-modelling-2-fc06", "q": "What are multiplicities?", "a": "Cardinality ratio and participation together, shown as (min, max), e.g. (0,*) or (1,1)."}, {"id": "com106-w3-er-modelling-2-fc07", "q": "Meaning of (0,1), (1,1), (0,*), (1,*)?", "a": "Zero or one; exactly one; zero or many; one or many."}, {"id": "com106-w3-er-modelling-2-fc08", "q": "A part might not be used in any project but can be used in many. Multiplicity?", "a": "(0,*)"}, {"id": "com106-w3-er-modelling-2-fc09", "q": "Weak vs strong entity type?", "a": "Weak: existence-dependent on another entity (e.g. NEXT_OF_KIN depends on PATIENT). Strong: not existence-dependent. Most are strong."}, {"id": "com106-w3-er-modelling-2-fc10", "q": "Can relationships have attributes?", "a": "Yes, e.g. Competes (between COMPETITOR and EVENT) can have result, time and medal_won."}, {"id": "com106-w3-er-modelling-2-fc11", "q": "Which ER notation does COM106 use?", "a": "Chen notation. Connolly & Begg use UML; you might also see Crow's Foot."}, {"id": "com106-w3-er-modelling-2-fc12", "q": "Rule: when is it OK to keep a team_manager attribute in COUNTRY?", "a": "When it's a single attribute. Two or more attributes about the manager (e.g. adding their mobile) means TEAM MANAGER is really another entity."}, {"id": "com106-w3-er-modelling-2-fc13", "q": "Does an attribute called 'room number' have to be numeric?", "a": "No. e.g. room 16C22 needs a character type."}, {"id": "com106-w3-er-modelling-2-fc14", "q": "Steps for creating an ER diagram?", "a": "1. Identify entities, attributes and identifiers. 2. Identify relationships. 3. Determine cardinality ratios. 4. Identify participation constraints. 5. Combine into the diagram."}, {"id": "com106-w3-er-modelling-2-fc15", "q": "Olympics: COUNTRY Sends COMPETITOR, COMPETITOR Competes_in EVENT, VENUE Holds EVENT: cardinalities?", "a": "Sends 1:N, Competes M:N, Holds 1:N (one venue, many events)."}], "mcq": [{"id": "com106-w2-er-modelling-intro-mcq01", "q": "Which development stage produces an outline Data Dictionary?", "o": ["Data Investigation", "Conceptual Design", "Database Implementation", "Data Modelling"], "a": 0, "e": "Investigation identifies the nature and use of the data."}, {"id": "com106-w2-er-modelling-intro-mcq02", "q": "Normalisation is described as a…", "o": ["Physical design technique", "Top-down approach", "Bottom-up approach", "Security technique"], "a": 2, "e": "ER modelling is top-down; normalisation is bottom-up and linked to the relational model."}, {"id": "com106-w2-er-modelling-intro-mcq03", "q": "In Chen notation, a relationship is drawn as a…", "o": ["Rectangle", "Oval", "Double rectangle", "Diamond"], "a": 3, "e": "Entities are rectangles; relationships are diamonds."}, {"id": "com106-w2-er-modelling-intro-mcq04", "q": "'Total Cost = Quantity × Unit Cost' is an example of which attribute type?", "o": ["Simple", "Derived", "Multi-valued", "Composite"], "a": 1, "e": "It can be calculated from other attributes."}, {"id": "com106-w2-er-modelling-intro-mcq05", "q": "Some lecturers teach many modules, but each module is taught by at most one lecturer. LECTURER Teaches MODULE is…", "o": ["M:N", "1:N", "1:1", "N:1 from LECTURER's side"], "a": 1, "e": "One lecturer to many modules = 1:N."}, {"id": "com106-w2-er-modelling-intro-mcq06", "q": "Why shouldn't 'days of the week' be an entity?", "o": ["There's only one instance", "Nobody cares about days", "They have no attributes", "The instances are fixed"], "a": 3, "e": "If the instances are fixed, an entity isn't needed."}, {"id": "com106-w2-er-modelling-intro-mcq07", "q": "If some employees are not assigned a company car, EMPLOYEE participation in Assigned is…", "o": ["Full", "Partial", "Derived", "Mandatory"], "a": 1, "e": "Some instances exist without taking part, so it's partial (single line)."}, {"id": "com106-w2-er-modelling-intro-mcq08", "q": "Full participation is shown on an ER diagram with a…", "o": ["Single line", "Dashed line", "Arrow", "Double line"], "a": 3, "e": "Double line = full; single line = partial."}, {"id": "com106-w2-er-modelling-intro-mcq09", "q": "The database needs to record every department an employee has EVER worked in. DEPARTMENT Employs EMPLOYEE becomes…", "o": ["Unary", "1:1", "1:N", "M:N"], "a": 3, "e": "History means an employee can link to many departments over time."}, {"id": "com106-w2-er-modelling-intro-mcq10", "q": "A relationship between three entity types has degree…", "o": ["Ternary", "Unary", "Quaternary", "Binary"], "a": 0, "e": "Degree = number of participating entity types."}, {"id": "com106-w2-er-modelling-intro-mcq11", "q": "By convention, entity names are…", "o": ["Singular", "Lower case", "Plural", "Verbs"], "a": 0, "e": "MODULE rather than MODULES."}, {"id": "com106-w3-er-modelling-2-mcq01", "q": "A path between two entities goes through two 1:N relationships fanning out from a central entity, making it ambiguous. This is a…", "o": ["Composite key", "Chasm trap", "Weak entity", "Fan trap"], "a": 3, "e": "Fan traps involve two 1:N relationships fanning out from one entity."}, {"id": "com106-w3-er-modelling-2-mcq02", "q": "A chasm trap is caused by…", "o": ["A missing primary key", "Two M:N relationships", "A derived attribute", "Partial participation in the indirect path"], "a": 3, "e": "Partial participation leaves some occurrences with no connection path."}, {"id": "com106-w3-er-modelling-2-mcq03", "q": "The usual fix for a chasm trap is to…", "o": ["Add the missing direct relationship", "Normalise to 3NF", "Make all participation partial", "Delete an entity"], "a": 0, "e": "e.g. add BRANCH Holds ACCOUNT."}, {"id": "com106-w3-er-modelling-2-mcq04", "q": "What does the multiplicity (1,*) mean?", "o": ["One or many", "Zero or one", "Zero or many", "Exactly one"], "a": 0, "e": "Min 1, max many."}, {"id": "com106-w3-er-modelling-2-mcq05", "q": "A PROJECT must use at least one PART but may use many. PROJECT's multiplicity in Used_in is…", "o": ["(0,1)", "(0,*)", "(1,*)", "(1,1)"], "a": 2, "e": "At least one (min 1), possibly many (max *)."}, {"id": "com106-w3-er-modelling-2-mcq06", "q": "NEXT_OF_KIN is only recorded if a PATIENT is recorded. NEXT_OF_KIN is a…", "o": ["Derived attribute", "Relationship", "Strong entity", "Weak entity"], "a": 3, "e": "It's existence-dependent on PATIENT."}, {"id": "com106-w3-er-modelling-2-mcq07", "q": "Where do the attributes 'result', 'time' and 'medal_won' belong in the Olympics model?", "o": ["VENUE", "COUNTRY", "COMPETITOR", "The Competes relationship"], "a": 3, "e": "They describe a competitor in a particular event, so they belong to the relationship."}, {"id": "com106-w3-er-modelling-2-mcq08", "q": "Which notation does COM106 use for ER diagrams?", "o": ["UML", "Crow's Foot", "Chen", "IDEF1X"], "a": 2, "e": "Chen notation. The textbook uses UML."}, {"id": "com106-w3-er-modelling-2-mcq09", "q": "STUDENT Attends MEETING: each student attends many meetings; each meeting is attended by one student. The ratio is…", "o": ["1:1", "N:1 (STUDENT to MEETING)", "1:N (STUDENT to MEETING)", "M:N"], "a": 2, "e": "One student, many meetings."}, {"id": "com106-w3-er-modelling-2-mcq10", "q": "Cardinality ratios and participation constraints together are called…", "o": ["Domains", "Schemas", "Dependencies", "Multiplicities"], "a": 3, "e": "Shown in (min, max) notation."}], "blanks": [{"id": "com106-w2-er-modelling-intro-fib01", "t": "An entity type is drawn as a labelled {{rectangle}} and a relationship as a labelled {{diamond}}.", "e": "Chen notation, used in this module."}, {"id": "com106-w2-er-modelling-intro-fib02", "t": "The number of participating entity types in a relationship is its {{degree}}.", "e": "Unary, binary, ternary…"}, {"id": "com106-w2-er-modelling-intro-fib03", "t": "Full participation is also called {{mandatory}} participation, and partial is also called {{optional}} participation.", "e": "Full = double line, partial = single line."}, {"id": "com106-w2-er-modelling-intro-fib04", "t": "A {{derived}} attribute has a value that can be calculated from other attributes.", "e": "e.g. Total Cost."}, {"id": "com106-w2-er-modelling-intro-fib05", "t": "Overall, an M:N relationship is a combination of two {{1:N|one-to-many}} relationships in both directions.", "e": "Always check both directions."}, {"id": "com106-w2-er-modelling-intro-fib06", "t": "Potential entities are usually {{nouns}} in the system description, and relationships are usually {{verbs}}.", "e": "Not every noun should become an entity though."}, {"id": "com106-w2-er-modelling-intro-fib07", "t": "The default assumption for participation constraints is {{full}}.", "e": "Unless the spec or real-world knowledge says otherwise."}, {"id": "com106-w3-er-modelling-2-fib01", "t": "The two main types of connection trap are {{fan}} traps and {{chasm}} traps.", "e": "Fan: ambiguity from two fanning 1:N relationships. Chasm: gaps from partial participation."}, {"id": "com106-w3-er-modelling-2-fib02", "t": "A {{weak}} entity type is existence-dependent on some other entity type.", "e": "e.g. NEXT_OF_KIN depends on PATIENT."}, {"id": "com106-w3-er-modelling-2-fib03", "t": "The multiplicity (0,*) means {{zero}} or many.", "e": "Min 0, max many."}, {"id": "com106-w3-er-modelling-2-fib04", "t": "Multiplicity records the {{minimum}} and {{maximum}} number of times an entity takes part in a relationship.", "e": "Written as (min, max)."}, {"id": "com106-w3-er-modelling-2-fib05", "t": "By convention, entity types are named in the {{singular}} form.", "e": "COMPETITOR, not COMPETITORS."}, {"id": "com106-w3-er-modelling-2-fib06", "t": "In this module ER diagrams use {{Chen}} notation, whereas Connolly & Begg use UML.", "e": "Crow's Foot is another common notation."}]}, "db2": {"cards": [{"id": "com106-w2-relational-model-keys-fc01", "q": "Who proposed the relational model, and when?", "a": "E. F. Codd, in 1970. It's based on mathematical set theory."}, {"id": "com106-w2-relational-model-keys-fc02", "q": "Relation / Attribute / Tuple: common and file-based equivalents?", "a": "Relation = Table = File. Attribute = Column = Field. Tuple = Row = Record. Domain ≈ Data type."}, {"id": "com106-w2-relational-model-keys-fc03", "q": "What is a domain?", "a": "The set of allowable values for one or more attributes. In practice, data types (plus integrity constraints) are used instead."}, {"id": "com106-w2-relational-model-keys-fc04", "q": "List the properties of a relation.", "a": "Distinct relation name; distinct attribute names; each cell holds one atomic value; values in an attribute come from the same domain; no duplicate tuples;
